# 每个数据集的 revision 在下载后钉死。status 保持 unpinned 时，正式脚本应拒绝运行。
# 划分由 tools/make_splits.py 写入 data/splits/，种子与实验指导第 4 节一致。
split_seed: 20261112
fractions: {cal: 0.2, sel: 0.2, test: 0.6}
small_task_minimum: {cal: 8, sel: 8}

datasets:
  - task: gsm8k
    family: short_math
    source: lm-evaluation-harness
    harness_task: gsm8k_cot
    num_fewshot: 8
    harness_revision: null
    metric: exact_match
    status: unpinned

  - task: math500
    family: mid_math
    source: HuggingFaceH4/MATH-500
    revision: null
    metric: accuracy
    status: unpinned

  - task: aime2024
    family: contest_math
    source: null
    revision: null
