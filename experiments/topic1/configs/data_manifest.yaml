    metric: pass_at_1
    decides_pass: false
    status: unpinned

  - task: longbench
    family: long_context
    source: THUDM/LongBench
    revision: null
    subtasks: [multidoc_qa, summarization, code]
    metric: official
    status: unpinned

  - task: ruler
    family: controlled_retrieval
    source: null
    revision: null
    lengths: [4096, 16384]
    metric: official_average
    status: unpinned

  - task: wikitext2
    family: language_modeling
