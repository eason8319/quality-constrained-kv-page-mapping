# 复制本文件到 runs/<run_id>/preregistration.yaml 再填写。
# 键的含义以 quality-and-format/课题一实验指导.md 第 15 节为准。
# P3 开始时，已填写的文件必须已经在 git 中。
protocol_version: v1
models:
  - meta-llama/Llama-3.1-8B-Instruct@<sha>
  - Qwen/Qwen2.5-7B-Instruct@<sha>
  - deepseek-ai/DeepSeek-R1-Distill-Qwen-7B@<sha>
page_length: 64
primary_window_W: 128
burst_bytes: 64
scale_fmt_main: fp16
split_seed: 20261112
panels:
  distribution_block: {model: llama, layers: all, heads: all, seq_per_task: 16}
  paired_panel: {layers: [], heads: []}
  dtest_probe: {seq_per_task: 16, pages: [sink, recent, mid]}
budgets:
  gsm8k_pp: 1.0
  math500_pp: 1.5
  longbench_pp: 1.0
  ruler_pp: 1.0
  macro_pp: 1.0
  aime_report_only: true
contrasts: [C1, C2, C3]
allocations_formal: [S0_grid, S1, S2, S3, S4_panel]
outlier_tau: null
predictor_gap_gate: 0.8
local_attn_to_S_switch: 0.5
