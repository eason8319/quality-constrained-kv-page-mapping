# P0 钉数据、评测代码和原始标注的版本；P2 冻结划分 ID、内容哈希与实际样本数。
# null 表示待实填。正式运行只使用已锁定清单。各数据集分别规定划分方式。
split_seed: 17
distribution_block: {tasks: [gsm8k, math500, longbench, ruler], distinct_sequences_per_task: 16}
generation_driver: shared_kv_cache

datasets:
  - task: gsm8k
    family: short_math
    source: openai/gsm8k
    config: main
    revision: 740312add88f781978c0658806c59bc2815b9866
    splits:
      development: {source_split: train, expected_pool_n: 7473, cal_n: 256, sel_n: 256, disjoint: true}
      test: {source_split: test, use_all: true, expected_n: 1319}
      exclude_from_development: [test_question_hashes, fewshot_question_hashes]
    evaluator: EleutherAI/lm-evaluation-harness
    harness_task: gsm8k_cot
    num_fewshot: 8
    harness_revision: d6de81643928d653435c431bae19945d41d32520
    metric: exact_match
    primary_filter: flexible-extract
    additional_filter: strict-match
    status: revision_pinned

  - task: math500
    family: mid_math
    source: HuggingFaceH4/MATH-500
    revision: 6e4ed1a2a79af7d8630a6b768ec859cb5af4d3be
    splits:
      development:
        source: EleutherAI/hendrycks_math
        revision: 21a5633873b6a120296cce3e2df9d5550074f4a3
        configs: [algebra, counting_and_probability, geometry, intermediate_algebra, number_theory, prealgebra, precalculus]
        source_split: train
        expected_pool_n: 7500
        cal_n: 256
        sel_n: 256
        stratify_by: config_name  # 七个学科各有一个配置。
        disjoint: true
        exclude_from_development: [test_question_hashes]
      test: {source_split: test, use_all: true, expected_n: 500, id_field: unique_id}
    metric: accuracy
    status: revision_pinned

  - task: aime2024
    family: contest_math
    source: HuggingFaceH4/aime_2024
    revision: 2fe88a2f1091d5048c0f36abc874fb997b3dd99a
    expected_n: 30
    question_check: runs/p0-affine_min-all-20261113-01/aime_question_check.json
    splits: {source_split: train, cal_n: 8, sel_n: 8, test_n: 14}
    metric: pass_at_1
    decides_pass: false
    status: revision_pinned

  - task: longbench
    family: long_context
    source: zai-org/LongBench
    data_archive: data.zip  # 从锁定 revision 的官方压缩包读取 JSONL。
    revision: 5e628be450b7e67fb7ae6e201bd6d8f7056f7672
    benchmark_version: v1
    evaluator: THUDM/LongBench
    evaluator_path: LongBench/
    evaluator_revision: 2e00731f8d0bff23dc4325161044d0ed8af94c1e
    subtasks: [hotpotqa, gov_report, repobench-p]
    splits: {source_split: test, per_subtask: true, group_by: context_hash, fractions: {cal: 0.2, sel: 0.2, test: 0.6}}
    natural_evidence:
      subtask: hotpotqa
      source: HotpotQA distractor dev
      source_url: https://hotpotqa.github.io/
      source_file_sha256: e3da074df24e8369009918aa5cdbdd254dadcde4c63f7569d36afd6f2268caa8
      labels: supporting_facts
      require_unique_sentence_alignment_after_truncation: true
    metric: official
    status: revision_pinned

  - task: ruler
    family: controlled_retrieval
    source: NVIDIA/RULER
    revision: db43f92ff634bbce1c33d1fb15858aec4bba509a
    benchmark: synthetic
    initial_source_audit: runs/p0-affine_min-all-20261113-01/split_audit.json
    essay_sources: runs/p0-affine_min-all-20261113-01/essay_sources.json
    squad_dev_v2_sha256: 80a5225e94905956a6446d296ca1093975c4d3b3260f1d6c8f68bc2ab77182d8
    hotpot_dev_distractor_sha256: e3da074df24e8369009918aa5cdbdd254dadcde4c63f7569d36afd6f2268caa8
    english_words_sha256: affcd6d45fdf3cc843d585c99c97ad615094e760e6c4756b654bab6c73bc2eca
    subtasks: [niah_single_1, niah_single_2, niah_single_3, niah_multikey_1, niah_multikey_2, niah_multikey_3, niah_multivalue, niah_multiquery, vt, cwe, fwe, qa_1, qa_2]
    lengths: [4096, 16384]
    splits:
      generate_by: [subtask, length, split]
      # 各格直接传一个显式种子，单 chunk 生成；变更 chunk 数须记录实际种子。
      seed_rule: "uint32_be(sha256(utf8(decimal(split_seed) + '/' + subtask + '/' + decimal(length) + '/' + split))[0:4])"
      subtask_counts_by_length: null  # P1 估计各格所需独立样本数，P2 固定。
      keep_source_question_in_one_split: true
      deduplicate_by_content: true
    metric: official_average
    status: revision_pinned

  - task: wikitext2
    family: language_modeling
    source: Salesforce/wikitext
    config: wikitext-2-raw-v1
    revision: b08601e04326c79dfdd32d625aee71d232d685c3
    splits: {source_split: validation, group_by: article, fractions: {cal: 0.2, sel: 0.2, test: 0.6}}
    segment_tokens: 2048
    metric: nll_per_token
    role: auxiliary
    status: revision_pinned
